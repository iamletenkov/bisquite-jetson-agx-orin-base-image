# Робот на AGX Orin: запись jetson-orin-workstation на SSD.
#
# Образ собирается цепочкой из трёх звеньев, см.
# ../build/jetson/orin/README.md: базовый образ изготавливается вне
# bisquite (BSP + jetson-disk-image-creator.sh) и регистрируется
# `bs image import`, поверх ложится слой камер, поверх него — рабочая
# станция с CUDA, TensorRT, GNOME, VNC и code-server.
#
# ⚠️ КУДА КЛАСТЬ СВОЙ. Не сюда: `examples/` коммитится. Скопируйте
# в каталог вне git (в этом репозитории — `.scratchpad/`), подставьте
# значения, `chmod 600`.
#
# Что здесь настоящее, а что нет:
#
#   serial / model  — НАСТОЯЩИЕ. Это идентификаторы железа, а не секрет.
#   имена сетевых
#   интерфейсов     — НАСТОЯЩИЕ и замеренные, см. оговорку ниже.
#   пароли          — `********`. Замените своими ПЕРЕД записью.
#   ssh-ключ        — плейсхолдер. Подставьте содержимое своего .pub.
#
# ЗАПУСК — через sudo и с явным каталогом данных:
#
#   sudo env BISQUITE_DATA_DIR=/home/jetson/.local/share/bisquite \
#     bs device write -f .scratchpad/jetson-orin/orin-robot.yml
#
# `BISQUITE_DATA_DIR` нужен, пока bisquite стоит не из deb-пакета: под
# root каталог данных резолвится от его домашнего, а не от пользовательского,
# и образ окажется «не найден». Установка из deb заводит общий
# `/var/lib/bisquite` (`root:bisquite`, `2770`), и переменная становится
# не нужна.

devices:
  - name: orin-robot
    image: jetson-orin-workstation:36.4.3

    # ⚠️ ПУТЬ /dev/sdX НЕ ЯВЛЯЕТСЯ ИДЕНТИФИКАТОРОМ — ядро раздаёт буквы
    # в порядке обнаружения. Перестановку ловит только сверка `serial`
    # и `model`, и она идёт ДО `dd`.
    #
    # ⚠️ ЭТО ДИСК В USB-БОКСЕ, и `serial` тут значит не то, что кажется:
    # `012345678933` — серийник МОСТА RTL9210B-CG, заводская заглушка,
    # а не номер диска. Сверка поймает подмену бокса; замену диска внутри
    # того же бокса — нет. Та же оговорка, что у картридера
    # в jetson-nano.yml и у диска станции в jetson-flash-station.yml.
    #
    # Носитель должен быть ≥ 40 ГБ: сверяется virtual size образа (его
    # задаёт `RESIZE size=40G` в jetson-orin-camera.vmfile) плюс раздел
    # cidata, а не размер файла qcow2, который в разы меньше.
    target: /dev/sda
    serial: "012345678933"
    model: "RTL9210B-CG"

    cloud-init:
      # Учётная запись робота. Вендорской в образе НЕТ вовсе: базовый
      # образ собран сценарием `04-customize-rootfs.sh -U`, то есть только
      # root без пароля. Всё, подо что можно войти, приходит отсюда.
      user: robot
      password: "********"
      root-password: "********"
      hostname: orin-robot-01

      # ⚠️ ИМЕНА ИНТЕРФЕЙСОВ ЗАМЕРЕНЫ НА ПЛАТЕ, А НЕ УГАДАНЫ.
      #
      # `ip -br link` на AGX Orin Devkit (L4T 36.4.3, 2026-09-12):
      # проводной — `eno1`, Wi-Fi — `wlP1p1s0`. НЕ `eth0`/`wlan0`:
      # предсказуемые имена udev дают здесь именно такие, и `wlP1p1s0`
      # выглядит опечаткой, но ею не является — `P1p1s0` это путь PCIe
      # до карты M.2.
      #
      # Почему это важнее, чем кажется: поле `name` обязательное и
      # wildcard не поддерживает. Вписанное мимо имя даёт МОЛЧАЛИВЫЙ
      # отказ — линк есть, адреса нет, на роутере клиент не появляется.
      # Ровно это уже случилось со станцией прошивки (замер 2026-09-11,
      # зашитый `enp1s0`), см. jetson-flash-station.yml.
      #
      # Секцию можно убрать целиком — тогда cloud-init применит свой
      # fallback: DHCP на интерфейсе с несущей, имя знать не нужно. Но
      # Wi-Fi так не настроить, а роботу он обычно нужен.
      network:
        # Проводной — запасной путь. Без него отладка сводится
        # к вытаскиванию носителя.
        - name: eno1
          mode: dhcp

        # Пароль Wi-Fi обязан быть не короче 8 символов — требование
        # WPA-PSK, проверяется на разборе манифеста.
        - name: wlP1p1s0
          mode: dhcp
          wifi:
            ssid: "ROBOT-LAB"
            password: "********"

      # ⚠️ Раздел cidata — обычный незашифрованный FAT32. Любой, кто
      # держит носитель в руках, прочитает и хеши паролей, и эти ключи.
      # Пароль Wi-Fi там лежит ВООБЩЕ В ОТКРЫТОМ ВИДЕ: network-config
      # это Netplan v2, и его поле `password` принимает саму парольную
      # фразу — WPA-PSK хешировать нечего.
      ssh-keys:
        - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5REPLACE_WITH_YOUR_PUBLIC_KEY robot@workstation

      firstboot-commands:
        # Метка готовности: видно, что первая загрузка доехала до конца.
        # Своей работы у неё нет — расширения доводят себя сами через
        # собственные юниты, и сети им для этого не нужно.
        - "echo 'Orin robot ready.' >> /var/log/firstboot.log"

        # VNC НАРУЖУ — РЕШЕНИЕ ЭТОЙ МАШИНЫ, А НЕ ТИРАЖА.
        #
        # В образе x11vnc слушает петлю: один робот стоит на стенде и его
        # отлаживают, другой уехал в поле, и умолчание обязано быть
        # закрытым. Раскомментируй две строки ниже, чтобы открыть ИМЕННО
        # этот носитель.
        #
        # Ради этого x11vnc и выбран вместо vino: настройка — файл,
        # который правится одной строкой. У vino ручкой служит dconf
        # пользователя, и отсюда в него не записать.
        #
        # ⚠️ Без пароля это открывает рабочий стол всей сети. Пароль
        # задаётся там же, строкой X11VNC_PASSWORD=<пароль>.
        #
        # `|| true` у restart не про небрежность: служба поднимается
        # по graphical.target, а эти команды идут из cloud-init и могут
        # опередить его. Файл к тому моменту уже правильный, и служба
        # прочитает его сама при старте.
        #
        # ⚠️ Ниже — ОТКРЫТИЕ НАРУЖУ. Всё это включено осознанно для стенда;
        # для робота в поле каждую строку надо пересмотреть отдельно.

        # SSH по паролю. cloud-init и так ставит ssh_pwauth: true, но
        # в образе может лежать своё правило в sshd_config.d — оно
        # сильнее. Дописываем явно и перезапускаем sshd.
        # Кавычки YAML здесь ОДИНАРНЫЕ намеренно. В двойных `\n` —
        # escape самого YAML, и до printf доезжает готовый перевод
        # строки: команда становится трёхстрочной. Работает она и так
        # (проверено на плате 2026-09-14, файл получился верным), но
        # читается как ошибка, а разбирается только запуском. В одинарных
        # `\n` остаётся двумя символами, и раскрывает его printf — то,
        # что и написано.
        - 'printf ''PasswordAuthentication yes\nKbdInteractiveAuthentication yes\n'' > /etc/ssh/sshd_config.d/99-bisquite-password-auth.conf'
        - "systemctl restart ssh || true"

        # VNC на все интерфейсы. В образе x11vnc слушает петлю — это
        # умолчание тиража; открывает конкретный носитель вот эта строка.
        # `|| true` не про небрежность: служба поднимается
        # по graphical.target и может стартовать позже cloud-init, но файл
        # к тому моменту уже правильный, и она прочитает его сама.
        - "sed -i 's/^X11VNC_LISTEN=.*/X11VNC_LISTEN=all/' /etc/default/bisquite-x11vnc"
        - "systemctl restart x11vnc@robot || true"

        # code-server на все интерфейсы. Пароля у него нет (в образе
        # CODE_SERVER_PASSWORD=none), поэтому строка ниже открывает
        # редактор с шеллом всей сети. Для стенда приемлемо, для поля —
        # задавай пароль в config.yaml перед тем, как это включать.
        #
        # ⚠️ ПРАВИТСЯ РУЧКА СБОРКИ, А НЕ КОНФИГ ПОЛЬЗОВАТЕЛЯ. Соблазн
        # написать сюда `sed` по /home/robot/.config/code-server/config.yaml
        # велик, и он НИКОГДА не сработает. Замер на живой плате
        # 2026-09-14: cloud-final закончил в 02:12:24.277, а
        # configure-code-server.service стартовал в 02:12:24.288 — через
        # 11 мс — и создал пользовательский конфиг только в 02:12:27.
        # То есть команда отсюда правила несуществующий файл, а `|| true`
        # это проглатывал; служба потом писала свой 127.0.0.1, и наружу
        # редактор не выходил.
        #
        # Гонки тут нет вовсе, и это не везение: юнит объявлен
        # `After=cloud-final.service`, то есть команды манифеста
        # гарантированно идут ПЕРВЫМИ. Значит правильная ручка — та,
        # что уже лежит в образе со сборки и читается службой при старте
        # (`read_config_value BIND`), ровно как /etc/default/bisquite-x11vnc
        # у VNC выше.
        #
        # Без `|| true`: файл кладёт расширение на сборке, и его
        # отсутствие означает, что образ собран не тем, чем думали, —
        # такое обязано быть громким. Перезапуск службы не нужен: она
        # ещё не стартовала и прочитает правку сама.
        - "sed -i 's/^BIND:.*/BIND: 0.0.0.0/' /opt/vmsetup/code-server/config.yaml"

      # Раздел cidata. Умолчание `new-partition` здесь верное: образ
      # несёт `INSTALL cloud-init` плюс расширение `nocloud-cidata`,
      # которое переводит NoCloud на метку тома `cidata` — её ставит
      # как раз этот раздел.
      #
      # `seed-cleanup` не задан, то есть `keep`: NoCloud перебирает
      # блочные устройства на КАЖДОЙ загрузке, а не только на первой.
      partition:
        scheme: gpt
        size: 100M
