# Робот на AGX Orin: запись jetson-orin-robot на SSD (цепочка образов —
# README.md этого репозитория).
#
# Свой манифест — не здесь: examples/ коммитится. Скопируйте в каталог вне
# git (в этом репозитории — .scratchpad/), подставьте пароли и ключ, chmod 600.
# serial, model и имена интерфейсов — настоящие, замерены на плате.
#
#   sudo env BISQUITE_DATA_DIR=/home/jetson/.local/share/bisquite \
#     bs device write -f .scratchpad/jetson-orin-write/orin-robot.yml
#
# BISQUITE_DATA_DIR нужен, пока bisquite стоит не из deb: под root каталог
# данных резолвится от домашнего каталога root. Перед записью отмонтируйте
# разделы носителя — иначе bisquite откажет.

devices:
  - name: orin-robot
    image: jetson-orin-robot:36.4.3

    # /dev/sdX — не идентификатор, перестановку ловит сверка serial и model
    # до записи. Здесь это серийник USB-моста RTL9210B-CG (заводская
    # заглушка): подмену бокса сверка поймает, замену диска в нём — нет.
    # Носитель ≥ 40 ГБ: virtual size образа (RESIZE в jetson-orin-base) + cidata.
    target: /dev/sda
    serial: "012345678933"
    model: "RTL9210B-CG"
    # Чем прошит QSPI платы. Образ требует ветку меткой boot.firmware: при
    # расхождении bs device write откажет до записи, без поля — предупредит.
    boot-firmware: jetson-qspi:r36.4

    cloud-init:
      # В образе только root без пароля — пользователь приходит отсюда.
      user: robot
      password: "********"
      root-password: "********"
      hostname: orin-robot-01

      # Имена с платы (ip -br link): eno1 и wlP1p1s0, не eth0/wlan0.
      # Неверное имя — молчаливый отказ: линк есть, адреса нет.
      network:
        - name: eno1
          mode: dhcp
        - name: wlP1p1s0
          mode: dhcp
          wifi:
            ssid: "ROBOT-LAB"
            password: "********"   # ≥ 8 символов (WPA-PSK)

      # Раздел cidata — открытый FAT32: хеши паролей, ключи и пароль Wi-Fi
      # (открытым текстом) прочитает любой, у кого носитель в руках.
      ssh-keys:
        - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5REPLACE_WITH_YOUR_PUBLIC_KEY robot@workstation

      firstboot-commands:
        - "echo 'Orin robot ready.' >> /var/log/firstboot.log"

        # ⚠️ Ниже — ослабление защиты, для стенда. Публикации служб наружу
        # здесь нет ни одной: VNC, Selkies и code-server остаются на петле,
        # как в образе. Снаружи ходят через Teleport (join — последней
        # командой ниже) или пробросом порта:
        #   ssh -L 6900:127.0.0.1:6900 <пользователь>@<робот>

        # SSH по паролю. Блок `>-` склеивает строки через пробел и не знает
        # экранирования: \n доходит до printf как есть.
        - >-
          printf 'PasswordAuthentication yes\nKbdInteractiveAuthentication yes\n'
          > /etc/ssh/sshd_config.d/99-bisquite-password-auth.conf
        - "systemctl restart ssh || true"

        # Настройки расширений — `bisquite-conf set <домен> KEY=VALUE`: значение
        # проверяется по схеме, опечатка даёт ненулевой код и строку
        # в cloud-init-output.log, а не молчаливый пропуск, как у `sed -i`.
        # Во время загрузки `set` только пишет — службы прочтут файл при старте.

        # VNC остаётся на петле и пароля не просит: к петле дотягивается
        # только тот, кто уже на машине, — у него и так шелл. Откроете
        # наружу — пароль обязателен, и подавать его надо со stdin, чтобы
        # он не попал в argv:
        #   echo '<пароль>' | bisquite-conf set x11vnc X11VNC_PASSWORD=-
        #
        # Строка ниже открыла бы VNC на все интерфейсы, и она намеренно
        # закомментирована: рабочий стол без пароля достался бы любому в сети.
        # --apply в ней нужен потому, что x11vnc@robot поднимается после
        # graphical.target и мог стартовать со старым файлом раньше этих
        # команд; хук перезапускает его без ожидания (--no-block), так что
        # из cloud-final это безопасно.
        # - "bisquite-conf set --apply x11vnc X11VNC_LISTEN=all"

        # Selkies наружу не открывается НИГДЕ и ни одним манифестом записи.
        # Это не осторожность про конкретный стенд: без пароля он отдаёт
        # рабочий стол, буфер обмена, файлы и API команд любому, кто дотянулся
        # до порта, — то есть равен шеллу. Он слушает 127.0.0.1:6900, как
        # задано в образе; снаружи — веб-приложение Teleport или
        #   ssh -L 6900:127.0.0.1:6900 <пользователь>@<робот>

        # code-server остаётся на петле. Строка ниже открыла бы его на все
        # интерфейсы — а он здесь без пароля, то есть это шелл в сеть.
        # Если всё же понадобится: без --apply, потому что его служба
        # настройки стоит After=cloud-final, ещё не работала и прочтёт правку
        # сама; перезапуск из cloud-final был бы взаимной блокировкой.
        # - "bisquite-conf set code-server CODE_SERVER_BIND=0.0.0.0"

        # Последним: join ждёт регистрации до 2 мин, остальное к этому времени настроено.
        # Teleport: адрес кластера, env (право доступа: tpEnv в LDAP) и токен
        # `tctl tokens add --type=node,app --ttl=<до первой загрузки>`. Токен
        # со stdin — не в argv; после регистрации стирается из конфига.
        # Seed с токеном стоит стереть: seed-cleanup: wipe-after-first-boot.
        - >-
          echo '********'
          | bisquite-teleport join
          TELEPORT_PROXY=teleport.example.org
          TELEPORT_TOKEN=-
          TELEPORT_ENV=dst

      # Seed остаётся на носителе: NoCloud читает его на каждой загрузке.
      partition:
        scheme: gpt
        size: 100M
